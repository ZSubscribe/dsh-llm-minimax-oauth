name: Release

# A release is a build for exactly one DeepSeek Harness build: the plugin
# version equals the DSH version, and `engines.dsh` names that harness build.
# The workflow fires on a `vX.Y.Z` tag and publishes the built plugin as a
# tarball, so a user can install the build that matches their harness.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: |
          for suite in tests/*.test.mts; do
            node --experimental-strip-types "$suite"
          done
          node tests/smoke.mjs

      - name: Build
        run: npm run build

      - name: Pack the plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          # `npm pack` already names the tarball `<name>-<version>.tgz`, and the
          # plugin version is the harness version — only rename when it differs.
          for archive in dist/*.tgz; do
            wanted="dist/dsh-llm-minimax-oauth-${GITHUB_REF_NAME#v}.tgz"
            if [ "$archive" != "$wanted" ]; then
              mv "$archive" "$wanted"
            fi
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build of dsh-llm-minimax-oauth for DeepSeek Harness $(node -p "require('./package.json').engines.dsh"). Install the build that matches your harness version: https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/VERSIONS.md"
          # A retagged release must not fail because the release already exists:
          # update it in place and replace the tarball.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes" \
              dist/*.tgz
          fi
