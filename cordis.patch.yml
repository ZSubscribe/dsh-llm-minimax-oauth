# Bundle layer applied when this package is listed in a profile's
# `dsh.profile.bundles`. Install:
#   dsh plugin --profile web add ./dsh-llm-minimax-oauth
#
# This plugin registers the `minimax-portal` (Global) and
# `minimax-portal-cn` (CN) provider routes on top of DSH's LLM runtime via
# custom `LlmAdapter`s. The user authorizes via browser once (device-code
# PKCE); tokens are persisted to `$DSH_HOME/minimax-oauth.json` and serialized
# into the per-region env vars `DSH_MINIMAX_OAUTH_TOKEN_MINIMAX_PORTAL`
# (Global) and `DSH_MINIMAX_OAUTH_TOKEN_MINIMAX_PORTAL_CN` (CN) so the
# adapters can authenticate Anthropic Messages requests with
# `Authorization: Bearer <access_token>` against
# `https://api.minimax.io/anthropic/v1/messages` (Global) or
# `https://api.minimaxi.com/anthropic/v1/messages` (CN).
#
# The built-in `pi-ai` `minimax` route (API-key path) is unchanged and stays
# available for users who prefer to authenticate via `MINIMAX_API_KEY`.
- insert:
    - id: llm-minimax-oauth
      name: dsh-llm-minimax-oauth
      inject: [llm, webServer]
